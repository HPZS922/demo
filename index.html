<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>System Check</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #00ff41;
    font-family: 'Courier New', Courier, monospace;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    -webkit-tap-highlight-color: transparent;
  }

  #terminal {
    width: 100%;
    max-width: 500px;
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .cursor {
    display: inline-block;
    width: 9px;
    height: 16px;
    background: #00ff41;
    vertical-align: middle;
    animation: blink 0.8s infinite;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  /* Glitch effect for the reveal */
  .glitch {
    color: #ff0040;
    font-weight: bold;
    animation: shake 0.3s infinite;
  }

  @keyframes shake {
    0% { transform: translate(0, 0); }
    25% { transform: translate(-2px, 1px); }
    50% { transform: translate(2px, -1px); }
    75% { transform: translate(-1px, -2px); }
    100% { transform: translate(1px, 2px); }
  }

  /* Final awareness screen */
  #awareness {
    display: none;
    text-align: center;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    animation: fadeIn 0.8s ease-in;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  #awareness h1 {
    font-size: 28px;
    color: #00ff41;
    margin-bottom: 15px;
    font-family: 'Courier New', monospace;
  }

  #awareness .emoji {
    font-size: 50px;
    margin-bottom: 10px;
    display: block;
  }

  #awareness p {
    font-size: 15px;
    line-height: 1.6;
    color: #ccc;
    margin-bottom: 20px;
    padding: 0 10px;
  }

  #awareness .tips {
    background: #111;
    border-left: 3px solid #00ff41;
    padding: 15px 20px;
    text-align: left;
    border-radius: 4px;
    margin: 0 auto;
    max-width: 400px;
  }

  #awareness .tips li {
    color: #ddd;
    font-size: 13px;
    margin-bottom: 8px;
    line-height: 1.5;
    list-style: none;
  }

  #awareness .tips li::before {
    content: "▸ ";
    color: #00ff41;
  }

  .red-flash {
    position: fixed;
    inset: 0;
    background: #ff0040;
    opacity: 0;
    pointer-events: none;
    z-index: 999;
  }

  .red-flash.active {
    animation: flash 0.15s 4;
  }

  @keyframes flash {
    0%, 100% { opacity: 0; }
    50% { opacity: 0.4; }
  }
</style>
</head>
<body>

<div id="terminal"></div>

<div id="awareness">
  <span class="emoji">😄</span>
  <h1>JUST KIDDING!</h1>
  <p>Nothing was hacked. Your device is 100% safe.<br>This was a QR code safety demo.</p>
  <div class="tips">
    <li>Never scan QR codes from unknown sources</li>
    <li>Check the URL before entering any info</li>
    <li>QR codes can lead to phishing sites</li>
    <li>When in doubt, don't scan</li>
  </div>
</div>

<div class="red-flash" id="flash"></div>

<script>
(function() {
  const terminal = document.getElementById('terminal');
  const awareness = document.getElementById('awareness');
  const flash = document.getElementById('flash');

  // Fake hacking sequence
  const lines = [
    { text: "> Initializing system scan...", delay: 400 },
    { text: "> Accessing device...", delay: 600 },
    { text: "> [OK] Connection established", delay: 500 },
    { text: "> Bypassing security protocols...", delay: 700 },
    { text: "> [OK] Firewall disabled", delay: 500 },
    { text: "> Extracting data...", delay: 600 },
    { text: "  ███░░░░░░░ 30%", delay: 300 },
    { text: "  ██████░░░░ 60%", delay: 300 },
    { text: "  █████████░ 90%", delay: 300 },
    { text: "  ██████████ 100%", delay: 400 },
    { text: "", delay: 200 },
    { text: "> UPLOADING PERSONAL DATA...", delay: 500 },
    { text: "> ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓", delay: 400 }
  ];

  let currentLine = 0;

  function typeLine() {
    if (currentLine >= lines.length) {
      // Trigger red flash + glitch, then reveal
      flash.classList.add('active');
      terminal.classList.add('glitch');

      setTimeout(() => {
        terminal.style.display = 'none';
        awareness.style.display = 'block';
      }, 700);
      return;
    }

    const line = lines[currentLine];
    const div = document.createElement('div');
    div.textContent = line.text;
    terminal.appendChild(div);

    // Add cursor to last line
    const oldCursor = document.querySelector('.cursor');
    if (oldCursor) oldCursor.remove();
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    terminal.appendChild(cursor);

    currentLine++;
    setTimeout(typeLine, line.delay);
  }

  // Start after a tiny delay so the page feels responsive
  setTimeout(typeLine, 300);
})();
</script>

</body>
</html>
